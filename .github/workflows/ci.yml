name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    # 设计书 §13.5：桌面端最小 CI——类型/单测/Node 版本防线。
    # 真实 dsh 冒烟（smoke:sidecar / smoke:plugin）需要 desktop/../deepseek-harness
    # 上游仓检出，CI 中不存在 → vitest 内部自动跳过（已接受的取舍）；
    # 核心防线是单测 + check:electron（Electron 内置 Node 满足 dsh engines）。
    # 包管理器与本地一致走 pnpm：补丁是 pnpm patchedDependencies（workspace 配置），
    # npm 装出来的树永远无补丁（2026-08-20 的 CI 事故即此）。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Electron Node version check
        run: npm run check:electron
      - name: Picker patch smoke
        run: npm run smoke:picker
      - name: Spawn windowsHide smoke
        run: npm run smoke:hideconsole
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
