name: CI

on:
  push:
    pull_request:

jobs:
  desktop:
    # 设计书 §13.5：桌面端最小 CI——类型/单测/Node 版本防线。
    # 真实 dsh 冒烟（smoke:sidecar / smoke:plugin）需要 desktop/../deepseek-harness
    # 上游仓检出，CI 中不存在 → vitest 内部自动跳过（已接受的取舍）；
    # 核心防线是单测 + check:electron（Electron 内置 Node 满足 dsh engines）。
    # 包管理器与本地一致走 pnpm：补丁是 pnpm patchedDependencies（workspace 配置），
    # npm 装出来的树永远无补丁（2026-08-20 的 CI 事故即此）。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Electron Node version check
        run: npm run check:electron
      - name: Picker patch smoke
        run: npm run smoke:picker
      - name: Spawn windowsHide smoke
        run: npm run smoke:hideconsole
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  desktop-linux:
    # Linux 侧防线：install 期的平台二进制解析（koffi/sharp linux 变体 + 5 个补丁应用）、
    # 单测里的 POSIX 分支（killSidecar 信号序列、pnpm sh shim、PATH 分隔符），外加一次
    # --dir 快速打包（linux-unpacked 布局 + verify-bundle 的 linux 分支演练）。
    # check:electron 在无头 runner 上需 ELECTRON_RUN_AS_NODE（裸跑 Electron 会在 GTK
    # 初始化挂起；脚本读的是内置 Node 版本，RUN_AS_NODE 下读数相同）。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Electron/electron-builder cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-electron-${{ hashFiles('desktop/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Electron Node version check
        run: npm run check:electron
        env:
          ELECTRON_RUN_AS_NODE: '1'
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Fast linux dir package
        run: pnpm run dist:dir:linux
      - name: Verify bundle
        run: pnpm run verify:bundle
