<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Dosket 插件管理</title>
  <style>
    body { font-family: system-ui; margin: 16px; display: flex; flex-direction: column; gap: 8px }
    pre { background: #111; color: #eee; padding: 8px; min-height: 120px; white-space: pre-wrap }
    .warn { color: #b00 }
  </style></head>
  <body>
    <h3>插件管理</h3>
    <p>安装插件 = 在本机执行第三方代码（pnpm 生命周期脚本），请仅安装信任来源的插件。</p>
    <div><input id="spec" placeholder="包名，如 dsh-plugin-x 或 github:user/repo" size="40" />
      <button id="add">安装</button></div>
    <div><select id="installed" size="1"></select> <button id="remove">卸载</button>
      <button id="restart" title="安装/卸载后需重启生效">重启生效</button></div>
    <pre id="out"></pre>
    <p class="warn" id="allowbuilds" style="display:none">git 托管插件被 pnpm 拦截构建时：按上方输出在 profile 的 pnpm-workspace.yaml 中 allowBuilds 后重试。</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
