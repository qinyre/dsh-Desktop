appId: com.dshdesktop.app
productName: DSH Desktop
directories:
  output: release
files:
  - out/**
  - resources/**
  - package.json
# ELECTRON_RUN_AS_NODE 的子进程读不了 asar：dsh 及其依赖、pnpm 必须解包到真实磁盘（设计书 §10）。
asarUnpack:
  - node_modules/**
# Chromium 自带 55 种语言包共 ~47MB；Web UI 有自己的 i18n（跟随系统 locale），壳层
# 只留中英两种，其余语言的原生界面字符串回退英文。
electronLanguages:
  - en-US
  - zh-CN
# 跳过 @electron/rebuild：本机无 VS 工具链，且唯一的原生依赖 node-pty 1.1.0 自带
# prebuilds/win32-x64（已验证可在 Electron-as-Node ABI 148 下加载并 spawn），
# 无需针对 Electron 头文件重编。
npmRebuild: false
win:
  target: NSIS
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # GitHub 会把资产文件名里的空格替换成点号，latest.yml 的 url 则用连字符——统一用
  # 无空格名，本地产物、上传资产、更新元数据三者一致。
  artifactName: DSH-Desktop-Setup-${version}.${ext}
# latest.yml（更新元数据）的生成需要显式 provider；构建脚本带 --publish never，
# 只在本地产出 latest.yml/blockmap 不上传——资产随 GitHub Release 手动上传，
# 运行期更新检查由 DSH_DESKTOP_FEED_URL 显式开启（updater 未设 feed 时静默跳过）。
publish:
  provider: github
  owner: qinyre
  repo: dsh-Desktop
# Linux（AppImage + deb）：AppImage 是唯一支持 electron-updater 自动更新的 Linux 目标
# （latest-linux.yml 资产随 Release 手动上传，差分 blockmap 内嵌在 AppImage 内）；deb 走
# 手动升级——运行时对无 APPIMAGE env 的 Linux 已禁用更新检查（index.ts），不会弹假
# 「已是最新」。静态 AppImage runtime（1.0.3）：免系统 libfuse2（Ubuntu 22.04+/Debian 12
# 默认不带），desktop entry 也不再预烘焙 --no-sandbox——AppRun 会在受限环境（如
# Ubuntu 24.04 的 AppArmor userns 限制）运行时探测并自动降级无沙箱。注意：Linux 目标
# 只能在 Linux/WSL 上构建（appimage/fpm 工具链没有 Windows host 支持），发布流程见
# README。
toolsets:
  appimage: "1.0.3"
linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: Utility
  # deb 元数据要求（fpm 校验 maintainer/email/homepage）。
  maintainer: qinyre <qinyre@users.noreply.github.com>
  # 默认 executableName 会从 productName 推出 "dsh desktop"（含空格）——/usr/bin 符号
  # 链接、hicolor 图标文件名、desktop entry 的 Icon= 与 verify-bundle 的可执行名四处
  # 同源，不可删。
  executableName: dsh-desktop
  syncDesktopName: true
  # GitHub 会把资产文件名里的空格替换成点号：延续 Windows 侧的无空格命名契约。
  artifactName: DSH-Desktop-${version}.${ext}
